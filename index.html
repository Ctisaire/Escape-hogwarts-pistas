<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Libro de Pistas</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
background:#111;
color:#d4af37;
font-family:'Cinzel',serif;
text-align:center;
padding:30px;
}

.contenedor{
max-width:800px;
margin:auto;
padding:30px;
border:2px solid #d4af37;
background:#1a1a1a;
border-radius:10px;
}

.logo{
width:150px;
display:block;
margin:auto;
}

input{
width:100%;
padding:12px;
margin-top:20px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:#d4af37;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<audio id="music" loop>
music.mp3
</audio>

<div class="contenedor">

<img src="hogwarts.png" class="logo">

<h1>📜 Libro de Pistas de Hogwarts 📜</h1>

<h2 id="titulo">Pista 1</h2>

<p id="texto">
Aquí aparecerá tu acertijo.
</p>

<input id="respuesta" placeholder="Escribe tu respuesta">

<button onclick="comprobar()">
🪄 Revelar Magia
</button>

<button onclick="toggleMusic()">
🎵 Música
</button>

<div id="resultado"></div>

</div>

<script>

function comprobar(){

const valor=document.getElementById("respuesta").value;

if(valor.toLowerCase()=="respuesta1"){

document.getElementById("resultado").innerHTML=
"✅ Correcto";

}else{

document.getElementById("resultado").innerHTML=
"❌ Incorrecto";

}

}

const music=document.getElementById("music");

function toggleMusic(){

if(music.paused){

music.play();

}else{

music.pause();

}

}

</script>

</body>
</html>
