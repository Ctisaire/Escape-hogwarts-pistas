<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📜 Libro de Pistas de Hogwarts</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    background:#111;
    color:#d4af37;
    font-family:'Cinzel',serif;
    text-align:center;
    padding:20px;
}

.contenedor{
    max-width:800px;
    margin:auto;
    padding:25px;
    border:2px solid #d4af37;
    background:#1a1a1a;
    border-radius:10px;
}

.logo{
    width:140px;
    display:block;
    margin:auto;
}

h1{
    margin-top:20px;
}

#texto{
    margin-top:20px;
    font-size:22px;
    line-height:1.8;
}

input{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    font-size:18px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#d4af37;
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#f0c75d;
}

#resultado{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

#ayuda{
    display:none;
    margin-top:20px;
    color:#ffd700;
    font-size:18px;
}

.correcto{
    color:#6dff7b;
}

.incorrecto{
    color:#ff6d6d;
}

@media(max-width:600px){

    #texto{
        font-size:18px;
    }

    h1{
        font-size:28px;
    }

    input{
        font-size:16px;
    }
}

</style>

</head>

<body>

<audio id="music" loop>
    <source src="./music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">
🎵 Activar / Desactivar Música
</button>

<div class="contenedor">

<img src="hogwarts.png" class="logo">

<h1>📜 Libro de Pistas de Hogwarts 📜</h1>

<h2 id="titulo"></h2>

<div id="texto"></div>

<input
id="respuesta"
placeholder="Escribe tu respuesta...">

<button onclick="comprobar()">
🪄 Comprobar
</button>

<button onclick="mostrarAyuda()">
🦉 Pedir Ayuda
</button>

<div id="ayuda"></div>

<div id="resultado"></div>

</div>

<script>

const pistas = {

1:{
titulo:"🔐 Mensaje Encriptado",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
},

2:{
titulo:"📜 Pista 2",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
},

3:{
titulo:"📜 Pista 3",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
},

4:{
titulo:"📜 Pista 4",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
},

5:{
titulo:"📜 Pista 5",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
},

6:{
titulo:"🏆 Pista Final",
texto:"PENDIENTE",
ayuda:"PENDIENTE",
respuesta:"pendiente",
destino:"PENDIENTE"
}

};

const parametro =
new URLSearchParams(window.location.search)
.get("pista") || "1";

const datos = pistas[parametro];

document.getElementById("titulo").innerHTML =
datos.titulo;

document.getElementById("texto").innerHTML =
datos.texto;

document.getElementById("ayuda").innerHTML =
datos.ayuda;

let intentos = 0;

function comprobar(){

const valor =
document.getElementById("respuesta")
.value
.toLowerCase()
.trim();

if(
valor === datos.respuesta.toLowerCase() ||
valor === datos.respuesta.replaceAll(" ","").toLowerCase()
){

document.getElementById("resultado")
.className="correcto";

document.getElementById("resultado")
.innerHTML=
"✅ Correcto.<br><br>⚡ La magia ha revelado el siguiente destino:<br><br><strong>"
+
datos.destino
+
"</strong>";

return;
}

intentos++;

if(intentos >= 2){

document.getElementById("resultado")
.className="incorrecto";

document.getElementById("resultado")
.innerHTML=
"❌ Has agotado tus intentos.";

}else{

document.getElementById("resultado")
.className="incorrecto";

document.getElementById("resultado")
.innerHTML=
"❌ Incorrecto. Te queda un intento.";
}

}

function mostrarAyuda(){

document.getElementById("ayuda")
.style.display="block";

}

const music=document.getElementById("music");

function toggleMusic(){

if(music.paused){

music.play();

}else{

music.pause();

}

}

document.addEventListener("click",()=>{

if(music.paused){

music.play().catch(()=>{});

}

},{once:true});

</script>

</body>
</html>
